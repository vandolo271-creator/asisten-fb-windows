
name: Build Asisten FB EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AsistenFB asisten_fb.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AsistenFB-Windows10-x64
          path: dist/AsistenFB.exe
