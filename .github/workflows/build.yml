name: Build Asisten FB WebView2 EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build EXE
        run: dotnet publish AsistenFB.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AsistenFB-WebView2-Windows10-x64
          path: bin/Release/net8.0-windows/win-x64/publish/AsistenFB.exe
